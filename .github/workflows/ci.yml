name: Reusable Build

on:
  workflow_call:
    inputs:
      app_path:
        description: Path containing the application package.json
        required: true
        type: string

      app_type:
        description: Application type, frontend or backend
        required: true
        type: string

      image_name:
        description: Harbor project and image name
        required: true
        type: string

      REGISTRY_USERNAME:
        required: true
        type: string

      runner_label:
        required: true
        type: string

    secrets:
      REGISTRY_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ${{ inputs.runner_label }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Validate application path
        shell: bash
        run: |
          if [ ! -d "${{ inputs.app_path }}" ]; then
            echo "Application path does not exist: ${{ inputs.app_path }}"
            exit 1
          fi

          if [ ! -f "${{ inputs.app_path }}/package.json" ]; then
            echo "package.json not found: ${{ inputs.app_path }}/package.json"
            exit 1
          fi

          if [ "${{ inputs.app_type }}" != "frontend" ] && \
             [ "${{ inputs.app_type }}" != "backend" ]; then
            echo "app_type must be frontend or backend"
            exit 1
          fi

      # -------------------------
      # Frontend Dockerfile
      # -------------------------
      - name: Create temporary frontend Dockerfile
        if: ${{ inputs.app_type == 'frontend' }}
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/Dockerfile.frontend" <<'EOF'
          FROM node:22-alpine AS build

          WORKDIR /app

          COPY package*.json ./
          RUN npm ci

          COPY . .
          RUN npm run build

          FROM nginx:1.27-alpine

          RUN printf 'server {\n\
            listen 80;\n\
            server_name _;\n\
            root /usr/share/nginx/html;\n\
            index index.html;\n\
            location / {\n\
              try_files $uri $uri/ /index.html;\n\
            }\n\
          }\n' > /etc/nginx/conf.d/default.conf

          COPY --from=build /app/dist /usr/share/nginx/html

          EXPOSE 80

          CMD ["nginx", "-g", "daemon off;"]
          EOF

      # -------------------------
      # Backend Dockerfile
      # -------------------------
      - name: Create temporary backend Dockerfile
        if: ${{ inputs.app_type == 'backend' }}
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/Dockerfile.backend" <<'EOF'
          FROM node:22-alpine AS build

          WORKDIR /app

          COPY package*.json ./
          RUN npm ci

          COPY . .
          RUN npm run build

          FROM node:22-alpine AS production

          WORKDIR /app

          ENV NODE_ENV=production

          COPY package*.json ./
          RUN npm ci --omit=dev && npm cache clean --force

          COPY --from=build /app/dist ./dist

          EXPOSE 3000

          CMD ["node", "dist/main.js"]
          EOF

      # -------------------------
      # Harbor Login
      # -------------------------
      - name: Login to Harbor
        shell: bash
        env:
          REGISTRY_USER: ${{ inputs.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | \
          docker login artifactory.infra.vcreatek.com \
            --username "$REGISTRY_USER" \
            --password-stdin

      # -------------------------
      # Frontend Build
      # -------------------------
      - name: Build frontend image
        if: ${{ inputs.app_type == 'frontend' }}
        shell: bash
        run: |
          docker build \
            --file "${RUNNER_TEMP}/Dockerfile.frontend" \
            --tag "artifactory.infra.vcreatek.com/${{ inputs.image_name }}:${GITHUB_SHA}" \
            --tag "artifactory.infra.vcreatek.com/${{ inputs.image_name }}:latest" \
            "${{ inputs.app_path }}"

      # -------------------------
      # Backend Build
      # -------------------------
      - name: Build backend image
        if: ${{ inputs.app_type == 'backend' }}
        shell: bash
        run: |
          docker build \
            --file "${RUNNER_TEMP}/Dockerfile.backend" \
            --tag "artifactory.infra.vcreatek.com/${{ inputs.image_name }}:${GITHUB_SHA}" \
            --tag "artifactory.infra.vcreatek.com/${{ inputs.image_name }}:latest" \
            "${{ inputs.app_path }}"

      # -------------------------
      # Push
      # -------------------------
      - name: Push image
        shell: bash
        run: |
          docker push \
            "artifactory.infra.vcreatek.com/${{ inputs.image_name }}:${GITHUB_SHA}"

          docker push \
            "artifactory.infra.vcreatek.com/${{ inputs.image_name }}:latest"

      # -------------------------
      # Logout
      # -------------------------
      - name: Logout from Harbor
        if: always()
        shell: bash
        run: |
          docker logout artifactory.infra.vcreatek.com || true
