name: Reusable Build

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

      REGISTRY_USERNAME:
        required: true
        type: string

      runner_label:
        required: true
        type: string

    secrets:
      REGISTRY_PASSWORD:
        required: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Secret Length
        run: |
          echo "Length: ${#REGISTRY_PASSWORD}"
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Debug Username
        run: |
          echo "Username=[${{ inputs.REGISTRY_USERNAME }}]"
      - name: Verify Username
        env:
         REGISTRY_USER: ${{ inputs.REGISTRY_USERNAME }}
        run: |
         printf 'Username=[%s]\n' "$REGISTRY_USER"
          
      - name: Docker Login
        env:
         REGISTRY_USER: ${{ inputs.REGISTRY_USERNAME }}
         REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login artifactory.infra.vcreatek.com \
          -u "$REGISTRY_USER" \
          --password-stdin

      - name: Build Image
        run: |
          docker build \
          -t artifactory.infra.vcreatek.com/${{ inputs.image_name }}:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push \
          artifactory.infra.vcreatek.com/${{ inputs.image_name }}:${{ github.sha }}
