name: Reusable Build

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

      app_name:
        required: true
        type: string
        
      REGISTRY_USERNAME:
        required: true
        type: string

      runner_label:
        required: true
        type: string

    secrets:
      REGISTRY_PASSWORD:
        required: true

      HELM_REPO_TOKEN:
       required: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Secret Length
        run: |
          echo "Length: ${#REGISTRY_PASSWORD}"
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Debug Username
        run: |
          echo "Username=[${{ inputs.REGISTRY_USERNAME }}]"
      - name: Verify Username
        env:
         REGISTRY_USER: ${{ inputs.REGISTRY_USERNAME }}
        run: |
         printf 'Username=[%s]\n' "$REGISTRY_USER"
          
      - name: Docker Login
        env:
         REGISTRY_USER: ${{ inputs.REGISTRY_USERNAME }}
         REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login artifactory.infra.vcreatek.com \
          -u "$REGISTRY_USER" \
          --password-stdin

      - name: Build Image
        run: |
         docker build \
           -t artifactory.infra.vcreatek.com/${{ inputs.image_name }}:${{ github.sha }} \
           -t artifactory.infra.vcreatek.com/${{ inputs.image_name }}:latest .

      - name: Push Image
        run: |
         docker push artifactory.infra.vcreatek.com/${{ inputs.image_name }}:${{ github.sha }}
         docker push artifactory.infra.vcreatek.com/${{ inputs.image_name }}:latest

      - name: Checkout Helm Repo
        uses: actions/checkout@v4
        with:
          repository: Reusablepipline/vcreatek-gitops
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: helm-repo

      - name: Update Helm Image Tag
        run: |
          sed -i "s/^  tag:.*/  tag: ${GITHUB_SHA}/" \
          helm-repo/${{ inputs.app_name }}/values.yaml

      - name: Commit Helm Changes
        run: |
          cd helm-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add values.yaml

          git commit -m "Deploy ${GITHUB_SHA}" || true

          git push
