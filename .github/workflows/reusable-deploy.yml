name: Reusable Deploy

on:
  workflow_call:
    inputs:
      REGISTRY_USERNAME:
        required: true
        type: string

      runner_label:
        required: true
        type: string

      DEPLOY_USER:
        required: true
        type: string

      DEPLOY_HOST:
        required: true
        type: string

      APP_PATH:
        required: true
        type: string

    secrets:
      REGISTRY_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ${{ inputs.runner_label }}

    steps:
      - name: Deploy Application
        env:
          REGISTRY_USER: ${{ inputs.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DEPLOY_USER: ${{ inputs.DEPLOY_USER }}
          DEPLOY_HOST: ${{ inputs.DEPLOY_HOST }}
          APP_PATH: ${{ inputs.APP_PATH }}

        run: |
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "
            docker logout artifactory.infra.vcreatek.com || true

            echo '$REGISTRY_PASSWORD' | \
            docker login artifactory.infra.vcreatek.com \
              -u '$REGISTRY_USER' \
              --password-stdin

            cd '$APP_PATH'

            docker-compose pull
            docker-compose down || true
            docker-compose up -d --force-recreate

            docker ps
          "
