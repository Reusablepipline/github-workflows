name: Reusable Deploy

on:
  workflow_call:
    inputs:
      REGISTRY_USERNAME:
        required: true
        type: string

      runner_label:
        required: true
        type: string

      DEPLOY_USER:
        required: true
        type: string

      DEPLOY_HOST:
        required: true
        type: string

      APP_PATH:
        required: true
        type: string

    secrets:
      REGISTRY_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Application
        env:
          REGISTRY_USER: ${{ inputs.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          ssh -o StrictHostKeyChecking=no test@10.10.0.20 "

          docker logout artifactory.infra.vcreatek.com || true

          echo '$REGISTRY_PASSWORD' | \
          docker login artifactory.infra.vcreatek.com \
          -u '$REGISTRY_USER' \
          --password-stdin

          cd /home/test/test-pipline

          docker-compose pull

          docker-compose down || true

          docker-compose up -d --force-recreate

          docker ps

          "
